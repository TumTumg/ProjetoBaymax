[tool.briefcase]
project_name = "PROJETOBAYMAX"
bundle = "com.projetobaymax"
version = "0.0.1"
url = "https://github.com/TumTumg/ProjetoBaymax/tree/v4/v4/app/pages"
license.file = "LICENSE"
author = "Baymax é um assistente virtual e sistema de gestão desenvolvido para o campus Senac. Com uma interface intuitiva e avançada tecnologia de interação por voz, Baymax serve como um hub central de informações e suporte para alunos, professores e visitantes. Ele facilita a navegação pelo campus, orienta sobre cursos e eventos, gerencia o calendário acadêmico e de eventos, e fornece dados sobre salas, professores e instalações em tempo real. Baymax também integra APIs para fornecer dados úteis, como informações climáticas e de transporte, enquanto mantém a segurança dos dados com medidas robustas contra ameaças digitais."
author_email = "baymaxprojeto@gmail.com"

